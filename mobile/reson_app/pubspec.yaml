name: reson_app
description: "Reson - PC soundboard remote control"
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  mobile_scanner: ^5.2.3
  file_picker: ^8.1.2
  vibration: ^2.0.0
  reorderable_grid_view: ^2.2.8
  uuid: ^4.5.1
  package_info_plus: ^8.0.2
  ota_update: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/reson_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/reson_logo.png"
  min_sdk_android: 24
  adaptive_icon_background: "#0a0a0a"
  adaptive_icon_foreground: "assets/reson_logo.png"
