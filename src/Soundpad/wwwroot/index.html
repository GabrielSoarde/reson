<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
  <title>Reson</title>
</head>
<body>
  <header>
    <h1>RESON</h1>
    <label class="monitor-toggle">
      <input type="checkbox" id="monitor" />
      <span>🎧 Monitor</span>
    </label>
  </header>
  <main>
    <div id="grid" class="grid"></div>
    <div id="orphans" class="orphans" hidden>
      <h2>Sem posição</h2>
      <div id="orphans-list"></div>
    </div>
  </main>
  <footer>
    <button id="stop" class="stop">■ STOP</button>
    <div class="vol-row">
      <input id="volume" type="range" min="0" max="100" />
      <span id="vol-value">--</span>
      <button id="settings" class="icon" title="Settings">⚙</button>
    </div>
  </footer>
  <!--
    Floating "+" upload trigger. Hidden file input is the real picker — the
    visible FAB just forwards click → input.click(). accept=.mp3,.wav,.ogg,.flac
    matches SoundLibrary.AllowedExtensions so the backend doesn't even see
    obviously-wrong files (the server still validates as a defense layer).
  -->
  <button id="upload-fab" class="upload-fab" aria-label="Adicionar som" title="Adicionar som">+</button>
  <input id="upload-input" type="file" accept=".mp3,.wav,.ogg,.flac" multiple hidden />
  <script src="/app.js"></script>
</body>
</html>
